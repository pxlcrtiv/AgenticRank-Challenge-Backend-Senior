version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite123
      POSTGRES_DB: quickbite_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:15
    environment:
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite123
      POSTGRES_DB: quickbite_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
